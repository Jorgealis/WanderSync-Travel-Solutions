# Actualizaciones automáticas de dependencias (tarea 5.8). Abre PRs semanales agrupados por
# ecosistema; el workflow `security` valida cada PR (pip-audit, npm audit, Trivy y pruebas).
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /services/flights-service
      - /services/hotels-service
      - /services/cars-service
      - /services/orders-service
      - /services/auth-service
      - /services/api-gateway
      - /services/mock-car-rental
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /data-pipeline
    schedule:
      interval: weekly
    groups:
      pipeline:
        patterns: ["*"]
    # Prefect 3.8 necesita SQLAlchemy 2.0 en esta imagen (con 2.1 su programador falla).
    ignore:
      - dependency-name: sqlalchemy
        versions: [">=2.1"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /services/flights-service
      - /services/hotels-service
      - /services/cars-service
      - /services/orders-service
      - /services/auth-service
      - /services/api-gateway
      - /services/mock-car-rental
      - /data-pipeline
      - /frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
