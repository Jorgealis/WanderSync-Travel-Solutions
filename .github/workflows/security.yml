# Seguridad de la cadena de suministro y pruebas sin infraestructura (tarea 5.8).
# Se ejecuta en cada PR, en cada push a prod/main y una vez por semana (vulnerabilidades nuevas
# en dependencias que no cambiaron). Las pruebas contra el stack completo (contrato de reservas,
# seguridad, E2E de la SAGA) se ejecutan localmente con scripts/run_service_tests.py.
name: security

on:
  pull_request:
  push:
    branches: [prod, main]
  schedule:
    - cron: "0 12 * * 1"   # lunes 07:00 hora Colombia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Si Dependabot (o alguien) cambia requirements.txt sin regenerar el lock, las imágenes
  # seguirían instalando las versiones viejas: este job lo impide.
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_locks.py

  pip-audit:
    name: pip-audit (${{ matrix.requirements }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - services/flights-service/requirements.lock
          - services/hotels-service/requirements.lock
          - services/cars-service/requirements.lock
          - services/orders-service/requirements.lock
          - services/auth-service/requirements.lock
          - services/api-gateway/requirements.lock
          - services/mock-car-rental/requirements.lock
          - data-pipeline/requirements.lock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      # El lock trae TODAS las dependencias (transitivas) con hashes; falla ante cualquier vulnerabilidad conocida.
      - run: pip-audit --requirement ${{ matrix.requirements }} --require-hashes --progress-spinner off

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Lo que llega al navegador: debe estar libre de vulnerabilidades moderadas o mayores.
      - run: npm audit --omit=dev --audit-level=moderate
      # Herramientas de desarrollo (no llegan al navegador): bloquean solo las críticas. Riesgo
      # aceptado documentado en docs/seguridad/README.md: braces <=3.0.3 (vía GraphQL Codegen) sin
      # versión corregida publicada.
      - run: npm audit --audit-level=critical
      # Codegen desde el contrato + TypeScript estricto + build de Vite.
      - run: npm run build

  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Pruebas del pipeline sin BD (scrapers, normalización, cuota)
        run: |
          docker build -f data-pipeline/Dockerfile --target test -t wandersync/data-pipeline:test .
          docker run --rm wandersync/data-pipeline:test pytest

  trivy:
    name: trivy (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: flights-service, dockerfile: services/flights-service/Dockerfile, target: runtime }
          - { name: orders-service, dockerfile: services/orders-service/Dockerfile, target: runtime }
          - { name: auth-service, dockerfile: services/auth-service/Dockerfile, target: runtime }
          - { name: api-gateway, dockerfile: services/api-gateway/Dockerfile, target: runtime }
          - { name: data-pipeline, dockerfile: data-pipeline/Dockerfile, target: runtime }
          - { name: frontend, dockerfile: frontend/Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker build -f ${{ matrix.image.dockerfile }} --target ${{ matrix.image.target }} -t wandersync/${{ matrix.image.name }}:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wandersync/${{ matrix.image.name }}:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # bloquea solo lo que ya tiene corrección publicada
          exit-code: "1"
