# =============================================================================
# Herramientas de DESARROLLO / DEMO (no usar en producción).
#
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
#
# Publica Postgres, la consola de Hasura y el API Gateway en 127.0.0.1 para inspeccionar el catálogo durante
# el desarrollo o la sustentación. Por defecto (solo docker-compose.yml) Hasura no
# publica puertos y la consola está desactivada (tarea 3.9).
# =============================================================================
services:
  # Postgres para DBeaver/psql. `backend` es interna (no publica puertos): se agrega `edge`.
  postgres:
    networks: [backend, edge]
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  hasura:
    networks: [backend, edge]
    ports:
      - "127.0.0.1:${HASURA_HOST_PORT:-8080}:8080"
    environment:
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      # La consola consulta /v1alpha1/config al cargar; en producción esa API sigue apagada.
      HASURA_GRAPHQL_ENABLED_APIS: graphql,metadata,config
      # Archivos de la consola desde la propia imagen (sin depender del CDN de Hasura ni de Internet).
      HASURA_GRAPHQL_CONSOLE_ASSETS_DIR: /srv/console-assets

  # API Gateway directo (sin pasar por Nginx), p. ej. para `npm run dev` en el frontend.
  api-gateway:
    ports:
      - "127.0.0.1:${API_GATEWAY_HOST_PORT:-8000}:8000"
