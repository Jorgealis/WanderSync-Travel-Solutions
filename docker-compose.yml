# =============================================================================
# WanderSync — despliegue completo con un solo comando:
#
#   cp .env.example .env      (y reemplazar los "change-me")
#   docker compose up --build
#
# Puertos publicados SOLO en 127.0.0.1 (no quedan expuestos a la red local).
# Los microservicios no publican puertos: solo son accesibles en la red `backend`.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-wandersync}

# --- Fragmentos reutilizables --------------------------------------------------

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: ${TZ:-UTC}

x-service-env: &service-env
  <<: *common-env
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-wandersync}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Defina INTERNAL_API_TOKEN en .env}

# Plantilla de microservicio FastAPI (tarea 1.5).
x-python-service: &python-service
  restart: unless-stopped
  networks: [backend]
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

# Imagen común de Dask + Prefect (tarea 1.3).
x-data-pipeline: &data-pipeline
  build:
    context: .
    dockerfile: data-pipeline/Dockerfile
  image: wandersync/data-pipeline:local
  restart: unless-stopped
  networks: [backend]

services:

  # ===========================================================================
  # Infraestructura de datos
  # ===========================================================================

  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    networks: [backend]
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"   # solo para desarrollo (DBeaver, psql)
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-wandersync}
      # Variables que consume infra/postgres/init/01-roles-and-schemas.sh
      FLIGHTS_DB_USER: ${FLIGHTS_DB_USER}
      FLIGHTS_DB_PASSWORD: ${FLIGHTS_DB_PASSWORD:?}
      HOTELS_DB_USER: ${HOTELS_DB_USER}
      HOTELS_DB_PASSWORD: ${HOTELS_DB_PASSWORD:?}
      CARS_DB_USER: ${CARS_DB_USER}
      CARS_DB_PASSWORD: ${CARS_DB_PASSWORD:?}
      ORDERS_DB_USER: ${ORDERS_DB_USER}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      INGEST_DB_USER: ${INGEST_DB_USER}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?}
      HASURA_RO_DB_USER: ${HASURA_RO_DB_USER}
      HASURA_RO_DB_PASSWORD: ${HASURA_RO_DB_PASSWORD:?}
      HASURA_METADATA_DB: ${HASURA_METADATA_DB}
      HASURA_METADATA_DB_USER: ${HASURA_METADATA_DB_USER}
      HASURA_METADATA_DB_PASSWORD: ${HASURA_METADATA_DB_PASSWORD:?}
      PREFECT_DB: ${PREFECT_DB}
      PREFECT_DB_USER: ${PREFECT_DB_USER}
      PREFECT_DB_PASSWORD: ${PREFECT_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: durante la inicialización Postgres solo escucha por socket,
      # así que el check por TCP no da "healthy" hasta que el init termina.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD en .env}
    # noeviction: Redis guarda sesiones; nunca debe borrarlas por falta de memoria.
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD"
      --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  hasura:
    image: hasura/graphql-engine:v2.51.0.cli-migrations-v3
    restart: unless-stopped
    networks: [backend]
    ports:
      - "127.0.0.1:${HASURA_HOST_PORT:-8080}:8080"   # consola (solo desarrollo)
    depends_on:
      postgres:
        condition: service_healthy
      flights-service:
        condition: service_healthy
      hotels-service:
        condition: service_healthy
      cars-service:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://${HASURA_METADATA_DB_USER}:${HASURA_METADATA_DB_PASSWORD}@postgres:5432/${HASURA_METADATA_DB}
      # Fuente de datos del catálogo (usuario de solo lectura). La metadata
      # la referencia con `from_env` en la tarea 3.8.
      CATALOG_DATABASE_URL: postgres://${HASURA_RO_DB_USER}:${HASURA_RO_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-wandersync}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?Defina HASURA_GRAPHQL_ADMIN_SECRET en .env}
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE:-false}
      HASURA_GRAPHQL_DEV_MODE: ${HASURA_GRAPHQL_DEV_MODE:-false}
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log
      HASURA_GRAPHQL_METADATA_DIR: /hasura-metadata
    volumes:
      - ./infra/hasura/metadata:/hasura-metadata:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # Computación distribuida (Dask) y orquestación (Prefect)
  # ===========================================================================

  dask-scheduler:
    <<: *data-pipeline
    command: ["dask", "scheduler", "--host", "0.0.0.0", "--dashboard-address", ":8787"]
    ports:
      - "127.0.0.1:${DASK_DASHBOARD_HOST_PORT:-8787}:8787"   # dashboard de Dask
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  dask-worker:
    <<: *data-pipeline
    command:
      - dask
      - worker
      - ${DASK_SCHEDULER_ADDRESS:-tcp://dask-scheduler:8786}
      - --nthreads
      - "${DASK_WORKER_NTHREADS:-2}"
      - --memory-limit
      - ${DASK_WORKER_MEMORY_LIMIT:-1GiB}
      - --dashboard-address
      - ":8789"
    deploy:
      replicas: ${DASK_WORKER_REPLICAS:-3}
    environment:
      <<: *common-env
      DASK_SCHEDULER_ADDRESS: ${DASK_SCHEDULER_ADDRESS:-tcp://dask-scheduler:8786}
      # Credenciales del usuario `ingest`: los workers escriben el catálogo (Fase 2).
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-wandersync}
      INGEST_DB_USER: ${INGEST_DB_USER}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?}
      MOCK_PROVIDERS_URL: ${MOCK_PROVIDERS_URL:-http://mock-providers:8000}
    depends_on:
      dask-scheduler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8789/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  prefect-server:
    <<: *data-pipeline
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    ports:
      - "127.0.0.1:${PREFECT_HOST_PORT:-4200}:4200"   # UI de Prefect
    environment:
      <<: *common-env
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@postgres:5432/${PREFECT_DB}
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-http://localhost:4200/api}
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  prefect-worker:
    <<: *data-pipeline
    # Crea el work pool `ingest-pool` si no existe y ejecuta los flows desplegados.
    command: ["prefect", "worker", "start", "--pool", "ingest-pool", "--type", "process"]
    environment:
      <<: *common-env
      PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect-server:4200/api}
      DASK_SCHEDULER_ADDRESS: ${DASK_SCHEDULER_ADDRESS:-tcp://dask-scheduler:8786}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-wandersync}
      INGEST_DB_USER: ${INGEST_DB_USER}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?}
      MOCK_PROVIDERS_URL: ${MOCK_PROVIDERS_URL:-http://mock-providers:8000}
      INGEST_SCHEDULE_CRON: ${INGEST_SCHEDULE_CRON:-*/10 * * * *}
      INGEST_ROUTES: ${INGEST_ROUTES:-}
      INGEST_DAYS_AHEAD: ${INGEST_DAYS_AHEAD:-14}
      INGEST_STAY_NIGHTS: ${INGEST_STAY_NIGHTS:-3,5,7}
      INGEST_MAX_PAGES: ${INGEST_MAX_PAGES:-5}
      INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-500}
      INGEST_TASK_RETRIES: ${INGEST_TASK_RETRIES:-3}
      INGEST_TASK_RETRY_DELAY_SECONDS: ${INGEST_TASK_RETRY_DELAY_SECONDS:-10}
    depends_on:
      prefect-server:
        condition: service_healthy
      dask-scheduler:
        condition: service_healthy

  # ===========================================================================
  # Microservicios (plantilla x-python-service). Cada uno recibe SOLO las
  # credenciales de su propio usuario de base de datos.
  # ===========================================================================

  flights-service:
    <<: *python-service
    build:
      context: .
      dockerfile: services/flights-service/Dockerfile
    environment:
      <<: *service-env
      DB_USER: ${FLIGHTS_DB_USER}
      DB_PASSWORD: ${FLIGHTS_DB_PASSWORD:?}
      ENABLE_FAULT_INJECTION: ${ENABLE_FAULT_INJECTION:-false}

  hotels-service:
    <<: *python-service
    build:
      context: .
      dockerfile: services/hotels-service/Dockerfile
    environment:
      <<: *service-env
      DB_USER: ${HOTELS_DB_USER}
      DB_PASSWORD: ${HOTELS_DB_PASSWORD:?}
      ENABLE_FAULT_INJECTION: ${ENABLE_FAULT_INJECTION:-false}

  cars-service:
    <<: *python-service
    build:
      context: .
      dockerfile: services/cars-service/Dockerfile
    environment:
      <<: *service-env
      DB_USER: ${CARS_DB_USER}
      DB_PASSWORD: ${CARS_DB_PASSWORD:?}
      ENABLE_FAULT_INJECTION: ${ENABLE_FAULT_INJECTION:-false}

  orders-service:
    <<: *python-service
    build:
      context: .
      dockerfile: services/orders-service/Dockerfile
    environment:
      <<: *service-env
      DB_USER: ${ORDERS_DB_USER}
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:?}
      ENABLE_FAULT_INJECTION: ${ENABLE_FAULT_INJECTION:-false}
      SAGA_STEP_TIMEOUT_SECONDS: ${SAGA_STEP_TIMEOUT_SECONDS:-3}
      SAGA_MAX_RETRIES: ${SAGA_MAX_RETRIES:-3}
      SAGA_RETRY_BACKOFF_SECONDS: ${SAGA_RETRY_BACKOFF_SECONDS:-0.5}
      SAGA_COMPENSATION_MAX_BACKOFF_SECONDS: ${SAGA_COMPENSATION_MAX_BACKOFF_SECONDS:-30}
      TAX_RATE: ${TAX_RATE:-0}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD en .env}
      RATE_LIMIT_PAYMENT: ${RATE_LIMIT_PAYMENT:-10/minute}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flights-service:
        condition: service_healthy
      hotels-service:
        condition: service_healthy
      cars-service:
        condition: service_healthy

  auth-service:
    <<: *python-service
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      <<: *service-env
      DB_USER: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      SESSION_ABSOLUTE_TIMEOUT_SECONDS: ${SESSION_ABSOLUTE_TIMEOUT_SECONDS:-28800}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST_KIB: ${ARGON2_MEMORY_COST_KIB:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    networks: [backend, frontend]
    ports:
      - "127.0.0.1:${API_GATEWAY_HOST_PORT:-8000}:8000"
    environment:
      <<: *common-env
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Defina INTERNAL_API_TOKEN en .env}
      HASURA_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?Defina HASURA_GRAPHQL_ADMIN_SECRET en .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD en .env}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
      ORDERS_SERVICE_URL: ${ORDERS_SERVICE_URL:-http://orders-service:8000}
      HASURA_GRAPHQL_URL: http://hasura:8080/v1/graphql
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ws_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_ABSOLUTE_TIMEOUT_SECONDS: ${SESSION_ABSOLUTE_TIMEOUT_SECONDS:-28800}
      GRAPHQL_MAX_DEPTH: ${GRAPHQL_MAX_DEPTH:-8}
      GRAPHQL_MAX_LIMIT: ${GRAPHQL_MAX_LIMIT:-50}
      GRAPHQL_INTROSPECTION: ${GRAPHQL_INTROSPECTION:-true}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5/minute}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-3/minute}
      RATE_LIMIT_BOOKING: ${RATE_LIMIT_BOOKING:-3/minute}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-120/minute}
      TAX_RATE: ${TAX_RATE:-0}
    depends_on:
      redis:
        condition: service_healthy
      hasura:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  backend:
    name: wandersync-backend
  frontend:
    name: wandersync-frontend

volumes:
  pgdata:
  redisdata:
