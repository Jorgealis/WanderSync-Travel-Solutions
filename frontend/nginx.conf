# Nginx del frontend (imagen sin root, escucha en 8080).
# - Sirve la SPA (cualquier ruta desconocida devuelve index.html para React Router).
# - Reenvía /graphql al API Gateway: navegador y API comparten origen (cookie SameSite=Strict
#   sin CORS) y el gateway no necesita publicar puertos.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Cabeceras de seguridad (tarea 5.4). La app solo carga recursos propios.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /graphql {
        proxy_pass http://api-gateway:8000/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Se REEMPLAZA (no se encadena) con la IP real: un cliente no puede falsificarla y el
        # rate limiting del gateway cuenta por usuario, no por la IP de este contenedor.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location /assets/ {
        # Nombres con hash de contenido: se pueden cachear indefinidamente.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
