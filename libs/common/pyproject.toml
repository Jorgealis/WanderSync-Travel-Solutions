[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wandersync-common"
version = "0.1.0"
description = "Utilidades compartidas por los microservicios de WanderSync"
requires-python = ">=3.12"
# Rangos amplios a propósito: las versiones exactas se fijan en el
# requirements.txt de cada servicio (que es lo que audita pip-audit).
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "httpx>=0.27",
  "tenacity>=8.5",
]

[tool.setuptools.packages.find]
include = ["wandersync_common*"]
